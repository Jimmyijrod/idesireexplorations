<svg xmlns="http://www.w3.org/2000/svg" width="120" height="30" viewBox="0 0 120 30">
  <!-- Bhutanese painted frieze: cloud/lotus motifs above a band of pearls -->
  <rect width="120" height="19" fill="#C9A45C"/>
  <rect y="19" width="120" height="11" fill="#A9442F"/>
  <rect y="18.4" width="120" height="1.2" fill="#3D2A22"/>

  <!-- Motif 1: terracotta -->
  <g fill="#C7663A">
    <path d="M6 19A14 14 0 0 1 34 19Z"/>
    <circle cx="6" cy="19" r="4"/><circle cx="7.9" cy="12" r="4"/><circle cx="13" cy="6.9" r="4"/>
    <circle cx="20" cy="5" r="4"/><circle cx="27" cy="6.9" r="4"/><circle cx="32.1" cy="12" r="4"/><circle cx="34" cy="19" r="4"/>
  </g>
  <path d="M10 19A10 10 0 0 1 30 19Z" fill="#E9A36E"/>
  <path d="M14 19A6 6 0 0 1 26 19Z" fill="#F7F6F1"/>

  <!-- Motif 2: charcoal -->
  <g fill="#4A4F4C">
    <path d="M46 19A14 14 0 0 1 74 19Z"/>
    <circle cx="46" cy="19" r="4"/><circle cx="47.9" cy="12" r="4"/><circle cx="53" cy="6.9" r="4"/>
    <circle cx="60" cy="5" r="4"/><circle cx="67" cy="6.9" r="4"/><circle cx="72.1" cy="12" r="4"/><circle cx="74" cy="19" r="4"/>
  </g>
  <path d="M50 19A10 10 0 0 1 70 19Z" fill="#8A8F8B"/>
  <path d="M54 19A6 6 0 0 1 66 19Z" fill="#F7F6F1"/>

  <!-- Motif 3: sage -->
  <g fill="#4C6A56">
    <path d="M86 19A14 14 0 0 1 114 19Z"/>
    <circle cx="86" cy="19" r="4"/><circle cx="87.9" cy="12" r="4"/><circle cx="93" cy="6.9" r="4"/>
    <circle cx="100" cy="5" r="4"/><circle cx="107" cy="6.9" r="4"/><circle cx="112.1" cy="12" r="4"/><circle cx="114" cy="19" r="4"/>
  </g>
  <path d="M90 19A10 10 0 0 1 110 19Z" fill="#8FA894"/>
  <path d="M94 19A6 6 0 0 1 106 19Z" fill="#F7F6F1"/>

  <!-- Re-cover the base line over the motifs -->
  <rect y="18.4" width="120" height="1.2" fill="#3D2A22"/>

  <!-- Pearls -->
  <g fill="#F7F6F1">
    <circle cx="10" cy="24.6" r="3.2"/><circle cx="30" cy="24.6" r="3.2"/><circle cx="50" cy="24.6" r="3.2"/>
    <circle cx="70" cy="24.6" r="3.2"/><circle cx="90" cy="24.6" r="3.2"/><circle cx="110" cy="24.6" r="3.2"/>
  </g>
</svg>
